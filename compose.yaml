name: ecommerce

services:
  # Laravel application (PHP-FPM)
  app:
    build: ./backend
    volumes:
      - ./backend:/var/www/html
      # Keep the image's vendor folder instead of the host's
      - vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy

  # Web server in front of PHP-FPM
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend/public:/var/www/html/public:ro
      # Uploaded files (product images) served directly at /storage
      - ./backend/storage/app/public:/var/www/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # Application database
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Inventory service (Node.js, gRPC on port 50051 inside the Docker network only)
  inventory:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    environment:
      DB_HOST: inventory-db
      DB_DATABASE: inventory
      DB_USERNAME: inventory
      DB_PASSWORD: secret
      # Demonstrating a slow service: SIMULATE_DELAY_MS=5000 docker compose up -d inventory
      SIMULATE_DELAY_MS: ${SIMULATE_DELAY_MS:-0}
    depends_on:
      inventory-db:
        condition: service_healthy

  # The inventory service's own database; the Laravel app never connects to it
  inventory-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: inventory
      MYSQL_USER: inventory
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - inventory-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  inventory-data:
  vendor:
